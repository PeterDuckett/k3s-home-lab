apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-paperclip
  namespace: flux-system
spec:
  interval: 15m
  retryInterval: 2m
  path: ./apps/overlays/prod/paperclip
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: longhorn
    - name: infrastructure-helm-repositories
    - name: infrastructure-cloudnative-pg-clusters
    - name: infrastructure-infisical-secrets-operator-auth
