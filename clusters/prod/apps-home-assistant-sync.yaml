apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-home-assistant
  namespace: flux-system
spec:
  interval: 15m
  retryInterval: 2m
  path: ./apps/overlays/prod/home-assistant
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-helm-repositories
