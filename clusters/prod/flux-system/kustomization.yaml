apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# kustomize-controller and helm-controller were CPU-throttled 7-9% of
# CFS periods at the bootstrap default 1000m limit (2026-10-19), which
# slows reconciles after a push. Patched here rather than in
# gotk-components.yaml so a future `flux bootstrap` regeneration keeps it.
patches:
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m
    target:
      kind: Deployment
      name: "(kustomize-controller|helm-controller)"
