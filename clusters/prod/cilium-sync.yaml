apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cilium
  namespace: flux-system
spec:
  interval: 15m
  prune: true
  wait: true # Flux waits for the core Cilium pods to be 100% healthy
  timeout: 5m
  path: ./infrastructure/cilium/overlays/prod
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cilium-config
  namespace: flux-system
spec:
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  # Points to the new subfolder containing your BGP pools
  path: ./infrastructure/cilium/overlays/prod/bgp-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  # THE FIX: Do not apply this until the main Cilium installation succeeds!
  dependsOn:
    - name: infrastructure-cilium
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-traefik
  namespace: flux-system
spec:
  interval: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/traefik/overlays/prod # Must match your Git path exactly!
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./infrastructure/cert-manager/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./infrastructure/longhorn/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cloudnative-pg
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: ./infrastructure/cloudnative-pg/overlays/prod
  prune: true
  wait: true # CRDs + operator must be ready before any Cluster CR can be applied
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
 name: infisical
 namespace: flux-system
spec:
 interval: 1h
 retryInterval: 2m
 path: ./infrastructure/infisical/overlays/prod
 prune: true
 sourceRef:
   kind: GitRepository
   name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-infisical-secrets-operator
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: ./infrastructure/infisical-secrets-operator/overlays/prod
  prune: true
  wait: true # CRDs + operator must be ready before any InfisicalConnection/InfisicalAuth CR can be applied
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-infisical-secrets-operator-auth
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: ./infrastructure/infisical-secrets-operator/overlays/prod/auth
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-infisical-secrets-operator # operator + CRDs
    - name: infisical # target Infisical instance must exist
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cloudnative-pg-clusters
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: ./infrastructure/cloudnative-pg/overlays/prod/postgres-clusters
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-cloudnative-pg # operator + CRDs
    - name: infisical # source DB for the one-time import must exist
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
 name: rancher
 namespace: flux-system
spec:
 interval: 1h
 retryInterval: 2m
 path: ./infrastructure/rancher/overlays/prod
 prune: true
 sourceRef:
   kind: GitRepository
   name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-valkey
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/valkey/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
