apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-traefik
  namespace: flux-system
spec:
  interval: 15m
  prune: true
  wait: true # Flux waits for the core Cilium pods to be 100% healthy
  timeout: 5m
  path: ./infrastructure/traefik/overlays/prod
  sourceRef:
    kind: GitRepository
    name: flux-system