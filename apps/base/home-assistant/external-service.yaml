# Home Assistant runs outside the cluster on a dedicated host
# (10.14.40.10:8123). A selectorless Service plus a hand-maintained
# EndpointSlice lets Traefik reverse-proxy to it through a normal Ingress.
# If the Home Assistant host IP ever changes, update the address below.
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant
  labels:
    kubernetes.io/service-name: home-assistant
addressType: IPv4
ports:
  - name: http
    port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 10.14.40.10
    conditions:
      ready: true
