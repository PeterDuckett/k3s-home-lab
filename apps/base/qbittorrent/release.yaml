---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  releaseName: qbittorrent
  chart:
    spec:
      chart: app-template
      # bjw-s-labs/helm-charts app-template. Verify this is still current
      # when Flux reconciles — pinned to major 3 as of early 2026.
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/qbittorrent
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "Etc/UTC"
              WEBUI_PORT: "8080"
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 768Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: &host qbittorrent.peterduckett.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: qbittorrent-tls
            hosts:
              - *host
    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: /config
