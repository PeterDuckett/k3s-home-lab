---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adsbhub
  namespace: flight-tracking
spec:
  releaseName: adsbhub
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/sdr-enthusiasts/docker-adsbhub
              tag: latest
              pullPolicy: Always
            env:
              TZ: "Europe/London"
              # ADSBHub consumes SBS/BaseStation (30003), not Beast.
              SBSHOST: "ultrafeeder"
              SBSPORT: "30003"
              CLIENTKEY:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: ADSBHUB_CLIENTKEY
