apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
  namespace: messaging
spec:
  releaseName: emqx
  chart:
    spec:
      chart: emqx
      version: "5.8.3"
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single node is enough for a home MQTT broker; the chart's k8s
    # cluster-discovery config is only needed when replicaCount > 1.
    replicaCount: 1
    resources:
      requests:
        cpu: "200m"
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1024Mi
    persistence:
      enabled: true
      storageClassName: longhorn
      resources:
        requests:
          storage: 4Gi
    service:
      type: LoadBalancer
      # Cilium native LB-IPAM (no MetalLB in this cluster) -- pins the
      # broker to a stable IP for MQTT clients, same pattern as Traefik
      # (.100), Infisical ingress (.128) and Postgres (.200).
      externalTrafficPolicy: Cluster
      annotations:
        io.cilium/lb-ipam-ips: "10.14.100.110"
      mqtt:
        enabled: true
        port: 1883
      dashboard:
        enabled: true
        port: 18083
