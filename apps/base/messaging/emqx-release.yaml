apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
  namespace: messaging
spec:
  releaseName: emqx
  chart:
    spec:
      chart: emqx
      version: "5.8.3"
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart's values.yaml has no hook for mounting an extra Secret as a
  # volume, so the emqx-mqtt-tls cert (from mqtt-certificate.yaml) is
  # mounted by patching the rendered StatefulSet directly -- Flux's
  # documented escape hatch for exactly this situation.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: emqx
            patch: |
              - op: add
                path: /spec/template/spec/volumes
                value:
                  - name: mqtt-tls
                    secret:
                      secretName: emqx-mqtt-tls
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: mqtt-tls
                  mountPath: /tls
                  readOnly: true
  values:
    # 3 nodes for real HA -- odd number so the cluster can heal from a
    # net-split. Needs k8s-based node discovery so each pod can find its
    # peers via the emqx-headless Service the chart creates.
    replicaCount: 3
    # This chart uses the classic emqxConfig env-var style (EMQX_<PATH>
    # mapped straight to container env), not a nested config.cluster.*
    # values block -- confirmed against the real chart after the first
    # deploy attempt failed with the nested form silently ignored.
    emqxConfig:
      EMQX_CLUSTER__DISCOVERY: "k8s"
      EMQX_CLUSTER__K8S__APISERVER: "https://kubernetes.default.svc:443"
      EMQX_CLUSTER__K8S__SERVICE_NAME: "emqx-headless"
      EMQX_CLUSTER__K8S__ADDRESS_TYPE: "hostname"
      EMQX_CLUSTER__K8S__NAMESPACE: "messaging"
      EMQX_CLUSTER__K8S__SUFFIX: "svc.cluster.local"
      # mqtt-tls Secret (tls.crt/tls.key) mounted at /tls by the
      # postRenderers patch above. HOCON path is
      # listeners.ssl.default.ssl_options.{certfile,keyfile}.
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: "/tls/tls.crt"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: "/tls/tls.key"
    resources:
      requests:
        cpu: "200m"
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1024Mi
    persistence:
      enabled: true
      storageClassName: longhorn
      resources:
        requests:
          storage: 4Gi
    service:
      type: LoadBalancer
      # Cilium native LB-IPAM (no MetalLB in this cluster). The pool
      # (homelab-lb-pool) only covers 10.14.100.100/30 and .128/25, so
      # .110 was never actually assignable -- confirmed by checking the
      # CiliumLoadBalancerIPPool directly. .130 is free within .128/25
      # (.128 is Infisical ingress, .200 is Postgres). The annotation key
      # is lbipam.cilium.io/ips, confirmed against Traefik's working
      # Service -- io.cilium/lb-ipam-ips (my first guess) doesn't exist
      # and was silently ignored.
      externalTrafficPolicy: Cluster
      annotations:
        lbipam.cilium.io/ips: "10.14.100.130"
      # Confirmed via a failed deploy attempt: these are plain ints in
      # this chart, not {enabled, port} objects.
      mqtt: 1883
      dashboard: 18083
    # Confirmed working: envFrom-injected keys from emqx-secret (synced
    # from Infisical at Messaging/EMQX) do reach the container and are
    # read by EMQX -- verified via kubectl exec env after deploy.
    extraEnvFrom:
      - secretRef:
          name: emqx-secret
