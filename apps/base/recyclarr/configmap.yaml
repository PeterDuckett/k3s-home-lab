# Recyclarr config, synced from TRaSH Guides into Radarr and Sonarr every
# 6h (CRON_SCHEDULE in release.yaml). Mounted as a directory at
# /config/configs, so edits here reach the pod without a restart. API keys
# come from env (recyclarr-secret, synced from Infisical /Downloads/Recyclarr).
#
# Profiles are the TRaSH v8 templates (recyclarr config-templates repo):
#   Radarr  HD Bluray + WEB   -- everyday 1080p
#           UHD Bluray + WEB  -- pick per movie for 4K; encodes, not remuxes
#   Sonarr  WEB-1080p
# Default CF groups for each profile (audio, HDR, streaming) are added
# automatically; the ones listed under `add:` are the optional extras the
# templates enable.
#
# Recyclarr only changes Radarr/Sonarr settings (profiles, custom formats,
# size limits). It never deletes media.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-configs
  namespace: downloads
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    radarr:
      radarr:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY
    
        delete_old_custom_formats: true
    
        quality_definition:
          type: movie
    
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
          - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
    
        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
            - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
    
    sonarr:
      sonarr:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
    
        delete_old_custom_formats: true
    
        quality_definition:
          type: series
    
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            reset_unmatched_scores:
              enabled: true
    
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
