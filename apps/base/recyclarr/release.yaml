---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: downloads
spec:
  releaseName: recyclarr
  chart:
    spec:
      chart: app-template
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # recyclarr is a config-sync CLI tool (TRaSH guides -> Sonarr/
    # Radarr), not a web app -- no Service/port. CRON_SCHEDULE keeps
    # it running continuously and syncing on a schedule instead of
    # running once and exiting. Config lives in configmap.yaml.
    controllers:
      main:
        pod:
          # Image runs as uid 1000 (gid 0); without fsGroup the Longhorn PVC
          # is root-owned and every run dies with "Access to the path
          # '/config/state' is denied" -- confirmed 2026-10-01.
          securityContext:
            fsGroup: 1000
        containers:
          main:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: "8"
            env:
              TZ: "Etc/UTC"
              CRON_SCHEDULE: "0 */6 * * *"
            # RADARR_API_KEY, SONARR_API_KEY -- read via !env_var in
            # recyclarr.yml.
            envFrom:
              - secretRef:
                  name: recyclarr-secret
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    persistence:
      config:
        existingClaim: recyclarr-config
        globalMounts:
          - path: /config
      configs:
        type: configMap
        name: recyclarr-configs
        globalMounts:
          - path: /config/configs
            readOnly: true
