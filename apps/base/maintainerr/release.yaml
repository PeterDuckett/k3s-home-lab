---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
  namespace: downloads
spec:
  releaseName: maintainerr
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Not a linuxserver.io image -- no PUID/PGID. v2.0.0 dropped root by
    # default (runs as 1000:1000) -- fsGroup makes the Longhorn-backed PVC
    # writable by that UID; without it the server crash-loops on startup
    # ("Could not create or access (files in) the data directory") and burns
    # CPU respawning every couple seconds -- confirmed 2026-09-17, was
    # pegging ~1 full core on node-1-3.
    controllers:
      main:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          main:
            image:
              repository: ghcr.io/jorenn92/maintainerr
              tag: latest
            env:
              TZ: "Etc/UTC"
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 6246
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          # Maintainerr has no login of its own -- see basicauth-middleware.yaml.
          traefik.ingress.kubernetes.io/router.middlewares: downloads-maintainerr-auth@kubernetescrd
        hosts:
          - host: &host maintainerr.peterduckett.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: maintainerr-tls
            hosts:
              - *host
    persistence:
      config:
        existingClaim: maintainerr-config
        globalMounts:
          - path: /opt/data
