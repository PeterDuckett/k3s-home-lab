---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
  namespace: downloads
spec:
  releaseName: maintainerr
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Not a linuxserver.io image -- no PUID/PGID.
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/jorenn92/maintainerr
              tag: latest
            env:
              TZ: "Etc/UTC"
    service:
      main:
        controller: main
        ports:
          http:
            port: 6246
    persistence:
      config:
        existingClaim: maintainerr-config
        globalMounts:
          - path: /opt/data
