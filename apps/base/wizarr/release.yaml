---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr
  namespace: downloads
spec:
  releaseName: wizarr
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # wizarr is not a linuxserver.io image either -- no PUID/PGID, it's
    # the official ghcr.io/wizarrrr/wizarr image. Its data path is
    # /data/database, not /config.
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: latest
            env:
              TZ: "Etc/UTC"
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 5690
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: &host wizarr.peterduckett.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: wizarr-tls
            hosts:
              - *host
    persistence:
      data:
        existingClaim: wizarr-data
        globalMounts:
          - path: /data/database
