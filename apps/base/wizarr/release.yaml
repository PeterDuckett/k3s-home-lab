---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr
  namespace: downloads
spec:
  releaseName: wizarr
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # wizarr is not a linuxserver.io image either -- no PUID/PGID, it's
    # the official ghcr.io/wizarrrr/wizarr image. Its data path is
    # /data/database, not /config.
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: latest
            env:
              TZ: "Etc/UTC"
    service:
      main:
        controller: main
        ports:
          http:
            port: 5690
    persistence:
      data:
        existingClaim: wizarr-data
        globalMounts:
          - path: /data/database
