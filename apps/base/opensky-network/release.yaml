---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensky-network
  namespace: flight-tracking
spec:
  releaseName: opensky-network
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/sdr-enthusiasts/docker-opensky-network
              tag: latest
              pullPolicy: Always
            env:
              TZ: "Europe/London"
              BEASTHOST: "ultrafeeder"
              BEASTPORT: "30005"
              ENABLE_MLAT: "true"
              # Push OpenSky's own MLAT results into ultrafeeder's mlathub so
              # they show on the local tar1090 map too (read-only from
              # mlathub's side; nothing is sent back to OpenSky).
              MLAT_RESULTS_BEASTHOST: "ultrafeeder"
              MLAT_RESULTS_BEASTPORT: "31004"
              LAT:
                valueFrom:
                  secretKeyRef:
                    name: opensky-network-secret
                    key: LATITUDE
              LONG:
                valueFrom:
                  secretKeyRef:
                    name: opensky-network-secret
                    key: LONGITUDE
              ALT:
                valueFrom:
                  secretKeyRef:
                    name: opensky-network-secret
                    key: ALTITUDE_M
              OPENSKY_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: opensky-network-secret
                    key: USERNAME
              OPENSKY_SERIAL:
                valueFrom:
                  secretKeyRef:
                    name: opensky-network-secret
                    key: SERIAL
            resources:
              requests:
                cpu: 40m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
