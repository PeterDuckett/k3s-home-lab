---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piaware
  namespace: flight-tracking
spec:
  releaseName: piaware
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/sdr-enthusiasts/docker-piaware
              tag: latest
              pullPolicy: Always
            env:
              TZ: "Europe/London"
              # Consume Beast from ultrafeeder instead of a local SDR.
              RECEIVER_TYPE: "relay"
              BEASTHOST: "ultrafeeder"
              BEASTPORT: "30005"
              ALLOW_MLAT: "yes"
              MLAT_RESULTS: "yes"
              FEEDER_ID:
                valueFrom:
                  secretKeyRef:
                    name: piaware-secret
                    key: FEEDER_ID
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
