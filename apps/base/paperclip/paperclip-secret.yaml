# Paperclip's runtime env, synced from Infisical. Lives with the app (not in
# infrastructure/infisical-secrets-operator/.../synced-secrets) because the
# ai namespace is created by this same Kustomization -- a CR there
# would fail the shared synced-secrets apply until this app had synced.
#
# Infisical layout (project 95bb0597-...bbf9, env prod):
#   /Database/PostgreSQL  PAPERCLIP_USERNAME (= paperclip), PAPERCLIP_PASSWORD
#   /Paperclip            BETTER_AUTH_SECRET                     openssl rand -hex 32
#                         PAPERCLIP_TOOL_ACTION_SIGNING_SECRET   openssl rand -hex 32 (must differ)
#                         PAPERCLIP_SECRETS_MASTER_KEY           openssl rand -hex 32
#                         (later, optional) ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY
#
# PAPERCLIP_PASSWORD is spliced into a URL unescaped -- keep it hex.
# PAPERCLIP_SECRETS_MASTER_KEY encrypts company secrets stored in Postgres;
# keeping it in Infisical (not only in the PVC's key file) means a lost PVC
# doesn't make the database's stored secrets unreadable. Never rotate it
# casually.
#
# The template only maps the keys listed; provider API keys added later
# need a line here too.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: paperclip-secret-sync
  namespace: ai
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Database/PostgreSQL
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Paperclip
  targets:
    - name: paperclip-secret
      namespace: ai
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          DATABASE_URL: 'postgres://{{ .PAPERCLIP_USERNAME.Value }}:{{ .PAPERCLIP_PASSWORD.Value }}@postgres-rw.database.svc.cluster.local:5432/paperclip'
          BETTER_AUTH_SECRET: '{{ .BETTER_AUTH_SECRET.Value }}'
          PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: '{{ .PAPERCLIP_TOOL_ACTION_SIGNING_SECRET.Value }}'
          PAPERCLIP_SECRETS_MASTER_KEY: '{{ .PAPERCLIP_SECRETS_MASTER_KEY.Value }}'
