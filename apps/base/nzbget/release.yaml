---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nzbget
  namespace: downloads
spec:
  releaseName: nzbget
  chart:
    spec:
      chart: app-template
      # bjw-s-labs/helm-charts app-template. Verify this is still current
      # when Flux reconciles — pinned to major 3 as of early 2026.
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/nzbget
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "Etc/UTC"
            resources:
              # Sized for ArticleCache=500 (MB) set in nzbget.conf on the
              # config PVC: cache + process + unpack headroom. Observed
              # ~870Mi working set while downloading (2026-10-15), too close
              # to the old 1Gi limit for an OOM kill mid-repair to be safe.
              requests:
                cpu: 100m
                memory: 512Mi
              # cpu limit 3 of node-2-3's 4 cores: par2 repair was throttled
              # at 2 (~15% of CFS periods). The low 100m request keeps the
              # Longhorn engine (which NZBGet's own I/O depends on) ahead
              # under contention.
              limits:
                cpu: "3"
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 6789
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: &host nzbget.peterduckett.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: nzbget-tls
            hosts:
              - *host
    persistence:
      config:
        existingClaim: nzbget-config
        globalMounts:
          - path: /config
