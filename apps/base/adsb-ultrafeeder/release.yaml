---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ultrafeeder
  namespace: flight-tracking
spec:
  releaseName: ultrafeeder
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        # USB device is a single physical resource on node-sdr -- never run two
        # copies at once.
        strategy: Recreate
        pod:
          annotations:
            # Restart when the Infisical-synced secret (location / UUID) changes.
            reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
              tag: latest
              pullPolicy: Always
            securityContext:
              # Required for raw RTL-SDR USB dongle access via /dev/bus/usb.
              privileged: true
            env:
              TZ: "Europe/London"
              # ---- Decoder / SDR ----
              READSB_DEVICE_TYPE: "rtlsdr"
              READSB_GAIN: "auto"
              READSB_RX_LOCATION_ACCURACY: "2"
              READSB_STATS_RANGE: "true"
              # ---- Web UI ----
              UPDATE_TAR1090: "true"
              # ---- Receiver location (from Infisical: /common) ----
              READSB_LAT:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: FEEDER_LAT
              READSB_LON:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: FEEDER_LONG
              READSB_ALT:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: FEEDER_ALT
              TAR1090_DEFAULTCENTERLAT:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: FEEDER_LAT
              TAR1090_DEFAULTCENTERLON:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: FEEDER_LONG
              # ---- Station identity (from Infisical: /flight-tracking) ----
              UUID:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: ULTRAFEEDER_UUID
              MLAT_USER:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: MLAT_USER
              TAR1090_PAGETITLE:
                valueFrom:
                  secretKeyRef:
                    name: flight-tracking-secrets
                    key: MLAT_USER
              # ---- Native aggregator feeds + MLAT ----
              # Free community aggregators fed directly by ultrafeeder. The six
              # dedicated feeder containers (FR24 / PlaneFinder / PiAware /
              # ADSBHub / OpenSky / AirNav) are separate HelmReleases that pull
              # Beast/SBS from this pod's Service. Tune the list here.
              ULTRAFEEDER_CONFIG: |-
                adsb,in.adsb.lol,30004,beast_reduce_plus_out;
                adsb,feed.adsb.fi,30004,beast_reduce_plus_out;
                adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out;
                adsb,feed.planespotters.net,30004,beast_reduce_plus_out;
                adsb,feed.theairtraffic.com,30004,beast_reduce_plus_out;
                mlat,in.adsb.lol,31090;
                mlat,feed.adsb.fi,31090;
                mlat,feed.adsbexchange.com,31090,39008;
                mlat,mlat.planespotters.net,31090;
                mlat,feed.theairtraffic.com,31090
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
          beast:
            port: 30005
          sbs:
            port: 30003
          beast-reduce:
            port: 30006
          mlat-hub:
            port: 30105
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: &host ultrafeeder.peterduckett.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: flight-tracking-ultrafeeder-tls
            hosts:
              - *host
    persistence:
      # Raw USB bus passthrough for the RTL-SDR dongle.
      host-usb:
        type: hostPath
        hostPath: /dev/bus/usb
        hostPathType: Directory
        globalMounts:
          - path: /dev/bus/usb
      # Heatmap / range history -- node-local on node-sdr (pod is pinned there).
      globe-history:
        type: hostPath
        hostPath: /opt/adsb/globe_history
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/globe_history
      # collectd graph data for graphs1090.
      graphs:
        type: hostPath
        hostPath: /opt/adsb/graphs
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/lib/collectd
      run:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /run
