---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ultrafeeder
  namespace: flight-tracking
spec:
  releaseName: ultrafeeder
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        # USB device is a single physical resource on node-sdr -- never run two
        # copies at once.
        strategy: Recreate
        pod:
          annotations:
            # Restart when the Infisical-synced secret (location / UUID) changes.
            reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
              tag: latest
              pullPolicy: Always
            securityContext:
              # Required for raw RTL-SDR USB dongle access via /dev/bus/usb.
              privileged: true
            env:
              TZ: "Europe/London"
              # ---- Decoder / SDR ----
              READSB_DEVICE_TYPE: "rtlsdr"
              READSB_GAIN: "auto"
              READSB_RX_LOCATION_ACCURACY: "2"
              READSB_STATS_RANGE: "true"
              # ---- Web UI ----
              UPDATE_TAR1090: "true"
              # ---- Receiver location (from Infisical: /common) ----
              READSB_LAT:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: LATITUDE
              READSB_LON:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: LONGITUDE
              READSB_ALT:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: ALTITUDE
              TAR1090_DEFAULTCENTERLAT:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: LATITUDE
              TAR1090_DEFAULTCENTERLON:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: LONGITUDE
              # ---- Station identity (from Infisical: /flight-tracking) ----
              UUID:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: UUID
              MLAT_USER:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: MLAT_USER
              TAR1090_PAGETITLE:
                valueFrom:
                  secretKeyRef:
                    name: ultrafeeder-secret
                    key: MLAT_USER
              # ---- Native aggregator feeds + MLAT ----
              # Free community aggregators fed directly by ultrafeeder. The six
              # dedicated feeder containers (FR24 / PlaneFinder / PiAware /
              # ADSBHub / OpenSky / AirNav) are separate HelmReleases that pull
              # Beast/SBS from this pod's Service. Tune the list here.
              #
              # The mlathub lines wire mlathub's merged MLAT results back into
              # readsb's dedicated MLAT input port (--net-bi-port=30004,30104)
              # so multilateration-derived aircraft actually show up on the
              # local tar1090 map. Direction is from mlathub's own point of
              # view (these connectors get added to MLATHUB's command line):
              #   - piaware / airnavradar: beast_in -- mlathub RECEIVES each
              #     one's own independently-computed MLAT results
              #     (FlightAware / RadarBox), which they already expose on
              #     port 30105 in Beast format for exactly this purpose.
              #     One-directional -- mlathub only reads these, nothing is
              #     sent back.
              #   - OpenSky pushes its own results into mlathub's input port
              #     (31004, exposed on this Service below) instead -- see
              #     apps/base/opensky-network for the matching env vars.
              #   - 127.0.0.1,30104,beast_out -- mlathub SENDS the merged
              #     result (5 aggregators + piaware + airnavradar + opensky)
              #     out to readsb itself.
              # Without that last line, MLAT still uploads fine to every
              # aggregator but nothing comes back to the local map --
              # confirmed missing 2026-09-16.
              #
              # FlightRadar24 was checked too (fr24feed.ini, mlat=yes) but its
              # closed-source feeder exposes no local results output or
              # results-forwarding option -- FR24's MLAT is server-side only,
              # no local feedback loop available.
              ULTRAFEEDER_CONFIG: |-
                adsb,in.adsb.lol,30004,beast_reduce_plus_out;
                adsb,feed.adsb.fi,30004,beast_reduce_plus_out;
                adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out;
                adsb,feed.planespotters.net,30004,beast_reduce_plus_out;
                adsb,feed.theairtraffic.com,30004,beast_reduce_plus_out;
                mlat,in.adsb.lol,31090;
                mlat,feed.adsb.fi,31090;
                mlat,feed.adsbexchange.com,31090,39008;
                mlat,mlat.planespotters.net,31090;
                mlat,feed.theairtraffic.com,31090;
                mlathub,piaware,30105,beast_in;
                mlathub,airnavradar,30105,beast_in;
                mlathub,127.0.0.1,30104,beast_out
            resources:
              requests:
                cpu: 150m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
          beast:
            port: 30005
          sbs:
            port: 30003
          beast-reduce:
            port: 30006
          # mlathub's actual output port (its merged Beast stream), in case
          # anything external wants to consume it directly.
          mlat-hub:
            port: 31005
          # mlathub's input port -- OpenSky's mlat-client connects here to
          # push its own MLAT results in (see apps/base/opensky-network).
          mlathub-in:
            port: 31004
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: &host ultrafeeder.peterduckett.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: flight-tracking-ultrafeeder-tls
            hosts:
              - *host
    persistence:
      # Raw USB bus passthrough for the RTL-SDR dongle.
      host-usb:
        type: hostPath
        hostPath: /dev/bus/usb
        hostPathType: Directory
        globalMounts:
          - path: /dev/bus/usb
      # Heatmap / range history -- node-local on node-sdr (pod is pinned there).
      globe-history:
        type: hostPath
        hostPath: /opt/adsb/globe_history
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/globe_history
      # collectd graph data for graphs1090.
      graphs:
        type: hostPath
        hostPath: /opt/adsb/graphs
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/lib/collectd
      run:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /run
