apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ultrafeeder
  namespace: flight-tracking
  labels:
    # kube-prometheus-stack's Prometheus (see infrastructure/monitoring) only
    # watches ServiceMonitors carrying this label by default
    # (serviceMonitorSelectorNilUsesHelmValues), regardless of namespace.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: ultrafeeder
  endpoints:
    - port: metrics
      interval: 30s
