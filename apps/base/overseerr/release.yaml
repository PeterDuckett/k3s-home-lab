---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: overseerr
  namespace: downloads
spec:
  releaseName: overseerr
  chart:
    spec:
      chart: app-template
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Seerr is the merged successor to Overseerr/Jellyseerr
    # (https://docs.seerr.dev/migration-guide/). It reuses the existing
    # overseerr-config volume and migrates settings.json + db on first start.
    # Names (release, Service, host, PVC) are kept as "overseerr" so nothing
    # that links to it has to change.
    #
    # Unlike the linuxserver image it runs as the non-root `node` user (1000)
    # with config at /app/config, not /config. Security settings mirror the
    # upstream seerr-chart.
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: latest
            env:
              TZ: "Etc/UTC"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 5055
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: &host overseerr.peterduckett.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: overseerr-tls
            hosts:
              - *host
    persistence:
      config:
        existingClaim: overseerr-config
        globalMounts:
          - path: /app/config
