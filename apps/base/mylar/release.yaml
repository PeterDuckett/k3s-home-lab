---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mylar
  namespace: downloads
spec:
  releaseName: mylar
  chart:
    spec:
      chart: app-template
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Original "mylar" is dead upstream -- mylar3 is the actively
    # maintained successor and the only one linuxserver.io still builds.
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/mylar3
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "Etc/UTC"
    service:
      main:
        controller: main
        ports:
          http:
            port: 8090
    persistence:
      config:
        existingClaim: mylar-config
        globalMounts:
          - path: /config
