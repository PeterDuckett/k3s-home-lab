# Kubernetes auto-creates a "default" ServiceAccount per namespace with
# automountServiceAccountToken defaulting to true. None of the apps in this
# namespace talk to the Kubernetes API, so every pod was getting an unused
# API token mounted for no reason -- confirmed 2026-09-17 that the default
# SA has zero RoleBindings anywhere, so the actual risk was low, but there's
# no reason to carry the exposure. This patches the existing default SA
# in place rather than creating a new one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: downloads
automountServiceAccountToken: false
