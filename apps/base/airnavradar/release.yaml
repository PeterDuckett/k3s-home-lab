---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airnavradar
  namespace: flight-tracking
spec:
  releaseName: airnavradar
  chart:
    spec:
      chart: app-template
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # AirNav Radar (formerly RadarBox).
              repository: ghcr.io/sdr-enthusiasts/docker-airnavradar
              tag: latest
              pullPolicy: Always
            env:
              TZ: "Europe/London"
              BEASTHOST: "ultrafeeder"
              BEASTPORT: "30005"
              SHARING_KEY:
                valueFrom:
                  secretKeyRef:
                    name: airnavradar-secret
                    key: SHARING_KEY
              LAT:
                valueFrom:
                  secretKeyRef:
                    name: airnavradar-secret
                    key: LATITUDE
              LONG:
                valueFrom:
                  secretKeyRef:
                    name: airnavradar-secret
                    key: LONGITUDE
              ALT:
                valueFrom:
                  secretKeyRef:
                    name: airnavradar-secret
                    key: ALTITUDE_M
            resources:
              requests:
                cpu: 60m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
    service:
      main:
        controller: main
        ports:
          # AirNavRadar/RadarBox's own MLAT results, Beast format. Pulled by
          # ultrafeeder's mlathub (see apps/base/adsb-ultrafeeder) to merge
          # into the local tar1090 map. Read-only from mlathub's side.
          mlat-results:
            port: 30105
