# Points the base home-assistant Service at the real Home Assistant host.
# Update the address here if the HA box ever moves.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant
  labels:
    kubernetes.io/service-name: home-assistant
addressType: IPv4
ports:
  - name: http
    port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 10.14.40.10
    conditions:
      ready: true
