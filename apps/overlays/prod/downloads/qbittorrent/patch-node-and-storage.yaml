apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: node-2-3
      # node-2-3 is tainted dedicated=downloads:NoSchedule so only the
      # download clients (plus system DaemonSets) run there.
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "downloads"
          effect: "NoSchedule"
    persistence:
      # In-progress downloads scratch: node-2-3's ssd1 as a plain hostPath
      # (it used to be a single-replica Longhorn volume, and the Longhorn
      # engine cost ~1.5 cores of the CM4 serving NZBGet's I/O). The disk is
      # mounted at /mnt/ssd1 with nofail, so point at a subdirectory that only
      # exists on the SSD: with hostPathType Directory, the pod refuses to
      # start if the disk isn't mounted instead of filling the root fs.
      downloads:
        type: hostPath
        hostPath: /mnt/ssd1/downloads
        hostPathType: Directory
        globalMounts:
          - path: /downloads
      # Finished downloads go to /media/downloads/torrent on the shared
      # library so the *arr apps can import with a hardlink/rename on the
      # same filesystem instead of copying across volumes.
      media:
        existingClaim: media-nas
        globalMounts:
          - path: /media
