apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nzbget
  namespace: downloads
spec:
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: node-2-3
      # node-2-3 is tainted dedicated=downloads:NoSchedule so only the
      # download clients (plus system DaemonSets) run there.
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "downloads"
          effect: "NoSchedule"
    persistence:
      # Local RWO scratch for in-progress downloads only; pins the pod to
      # node-2-3.
      downloads:
        existingClaim: downloads-ssd
        globalMounts:
          - path: /downloads
      # Finished downloads go to /media/downloads/usenet on the shared
      # library so the *arr apps can import with a hardlink/rename on the
      # same filesystem instead of copying across volumes.
      media:
        existingClaim: media-nas
        globalMounts:
          - path: /media
