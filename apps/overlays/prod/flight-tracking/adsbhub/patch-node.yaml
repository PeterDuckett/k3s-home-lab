apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adsbhub
  namespace: flight-tracking
spec:
  values:
    # Keep feeders beside ultrafeeder on the Pi5 with the RTL-SDR dongle:
    # they only feed from ultrafeeder, so they're no use when node-sdr is down.
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: node-sdr
