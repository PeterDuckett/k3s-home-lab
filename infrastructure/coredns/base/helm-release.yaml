# Cluster DNS, replacing k3s's packaged CoreDNS (k3s hard-codes
# `pods insecure` in its Corefile, which rules out autopath, and runs a
# single replica). Named coredns-helm so nothing collides with the k3s
# addon's own coredns Deployment/ConfigMap during the cutover; the pods
# carry k8s-app=kube-dns so the kube-dns Service routes to them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: kube-system
spec:
  interval: 30m
  releaseName: coredns-helm
  chart:
    spec:
      chart: coredns
      version: "1.49.x"
      sourceRef:
        kind: HelmRepository
        name: coredns
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: coredns-helm
    k8sAppLabelOverride: kube-dns

    replicaCount: 2
    priorityClassName: system-cluster-critical
    # Same tolerations as the k3s addon. No nodeSelector: upstream DNS is
    # set explicitly below, so a pod behaves the same on any node.
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: coredns-helm
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 70Mi
      limits:
        memory: 256Mi

    # Chart's own Service (coredns-helm) is unused; kube-dns-service.yaml
    # is the one pods actually query.
    service:
      name: coredns-helm

    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          # `pods verified` (not k3s's `insecure`) is what autopath needs:
          # it maps the query's source IP to a pod to get its namespace.
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
              ttl 30
          # Resolves the whole ndots:5 search path server-side in one round
          # trip instead of the client trying each suffix. ~63% of answers
          # were NXDOMAIN from search-path misses before this (2026-10-19).
          - name: autopath
            parameters: "@kubernetes"
          # Replaces k3s's auto-generated NodeHosts. Node IPs are static;
          # add a line here when a node is added. Nothing in the repo
          # resolves node hostnames today -- kept for parity.
          - name: hosts
            configBlock: |-
              10.14.100.12 node-1-2
              10.14.100.13 node-1-3
              10.14.100.14 node-1-4
              10.14.100.21 node-2-1
              10.14.100.22 node-2-2
              10.14.100.23 node-2-3
              10.14.100.24 node-2-4
              10.14.100.50 node-sdr
              ttl 60
              fallthrough
          - name: prometheus
            parameters: 0.0.0.0:9153
          # Explicit upstreams, matching what every node's resolv.conf
          # already uses, so a pod's node (and the RK1s' systemd-resolved
          # history) doesn't change DNS behaviour.
          - name: forward
            parameters: . 1.1.1.1 9.9.9.9
          - name: cache
            configBlock: |-
              success 9984 300
              denial 9984 30
              prefetch 10 1m 10%
          - name: loop
          - name: reload
          - name: loadbalance
