apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: infisical-standalone
      version: "1.8.x" 
      sourceRef:
        kind: HelmRepository
        name: infisical
      interval: 1h
  targetNamespace: infisical
  install:
    createNamespace: true
  dependsOn:
    - name: valkey
      namespace: database
    - name: cloudnative-pg
  values:

    infisical:
      readinessProbe:
        httpGet:
          path: /api/status
          port: 8080
        initialDelaySeconds: 100  # Increased from default 10 to give ARM nodes breathing room
        periodSeconds: 10
        failureThreshold: 3

    secrets:
      encryptionKey: "f3cbe836dabccc0da275d03d4be8b689a1699e910c036418130485eec6d3fce6"
      authSecret: "eacb586002ad6687b0ef42c77e6dd08fb285f26137b2c0bc22c8139b42ce1c2c"

    # 1. Main Infisical Application Settings
    backend:
      replicaCount: 2
      # Generate a random 32-byte hex string for this key before deploying
      encryptionKey: "f3cbe836dabccc0da275d03d4be8b689a1699e910c036418130485eec6d3fce6"
      
      # Pin Infisical API server to your Turing Pi masters
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

    # 2. Database (Postgres) -- use the shared HA CloudNativePG cluster in the
    # database namespace instead of the chart's bundled single-instance
    # Postgres. The actual DB_CONNECTION_URI pointing at it is set in
    # overlays/prod/secrets.yaml (the chart pulls it in via envFrom on the
    # infisical-secrets Secret, same pattern as REDIS_URL/Valkey above).
    postgresql:
      enabled: false

    # 3. Cache (Redis-compatible) -- use the shared Valkey instance in the
    # database namespace instead of the chart's bundled Redis. The actual
    # REDIS_URL pointing at Valkey is set in overlays/prod/secrets.yaml
    # (the chart pulls it in via envFrom on the infisical-secrets Secret).
    redis:
      enabled: false