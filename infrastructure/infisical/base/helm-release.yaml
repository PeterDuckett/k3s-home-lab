apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: flux-system
spec:
  interval: 30m
  # Pods have a 100s readiness delay and roll one at a time, which overruns
  # Helm's default 5m wait on ARM.
  timeout: 10m
  chart:
    spec:
      chart: infisical-standalone
      version: "1.12.x" 
      sourceRef:
        kind: HelmRepository
        name: infisical
      interval: 1h
  targetNamespace: infisical
  install:
    createNamespace: true
  dependsOn:
    - name: valkey
      namespace: database
    - name: cloudnative-pg
  values:

    infisical:
      # Scheduling must live under `infisical:` -- the chart never read the
      # old `backend:` block, so these were silently ignored and pods drifted
      # onto the Pi workers (one took ~10 min to go Ready on node-2-4 during
      # the 2026-11-13 RK1 reboots). Keep 2 replicas, on the RK1s, preferably
      # on different nodes so a single RK1 reboot can't take both down.
      replicaCount: 2
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    component: infisical
                    release: infisical-infisical
      readinessProbe:
        httpGet:
          path: /api/status
          port: 8080
        initialDelaySeconds: 100  # Increased from default 10 to give ARM nodes breathing room
        periodSeconds: 10
        failureThreshold: 3
      # Chart default is a 1000Mi limit; both pods sat at 82-84% of it
      # (814-865Mi) on 2026-10-19 with no headroom for a burst.
      resources:
        limits:
          memory: 1536Mi
        requests:
          cpu: 350m
          memory: 1Gi

    secrets:
      encryptionKey: "f3cbe836dabccc0da275d03d4be8b689a1699e910c036418130485eec6d3fce6"
      authSecret: "eacb586002ad6687b0ef42c77e6dd08fb285f26137b2c0bc22c8139b42ce1c2c"

    # Serve the UI through Traefik instead of the chart's bundled
    # ingress-nginx. The bundled controller was v1.1.0 (2021, k8s.gcr.io)
    # with its admission webhook on, i.e. exposed to IngressNightmare
    # (CVE-2025-1974): unauthenticated RCE from any pod, and the controller
    # can read every Secret in the cluster. ingress-nginx is also retired
    # upstream. The secrets operator talks to the Service directly
    # (InfisicalConnection -> *.svc.cluster.local:8080), so it is unaffected.
    ingress:
      enabled: true
      hostName: infisical.peterduckett.me
      ingressClassName: traefik
      nginx:
        enabled: false
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.middlewares: infisical-lan-only@kubernetescrd
      tls:
        - secretName: infisical-tls
          hosts:
            - infisical.peterduckett.me

    # 2. Database (Postgres) -- use the shared HA CloudNativePG cluster in the
    # database namespace instead of the chart's bundled single-instance
    # Postgres. The actual DB_CONNECTION_URI pointing at it is set in
    # overlays/prod/secrets.yaml (the chart pulls it in via envFrom on the
    # infisical-secrets Secret, same pattern as REDIS_URL/Valkey above).
    postgresql:
      enabled: false

    # 3. Cache (Redis-compatible) -- use the shared Valkey instance in the
    # database namespace instead of the chart's bundled Redis. The actual
    # REDIS_URL pointing at Valkey is set in overlays/prod/secrets.yaml
    # (the chart pulls it in via envFrom on the infisical-secrets Secret).
    redis:
      enabled: false