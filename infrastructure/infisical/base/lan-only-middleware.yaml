# Infisical holds every secret the cluster uses, so its UI is LAN-only.
# Traefik sees real client addresses (Cilium keeps the source IP), so this
# allowlist is enforced. Do NOT create a public Cloudflare DNS record for
# infisical.peterduckett.me -- resolve it on the LAN only (UniFi local DNS).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: infisical
spec:
  ipAllowList:
    sourceRange:
      - 10.14.60.0/24 # Home VLAN
