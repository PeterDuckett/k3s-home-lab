apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  releaseName: descheduler
  interval: 10m
  chart:
    spec:
      chart: descheduler
      version: "0.32.2" # Matches modern K8s release cycles
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: kube-system
      interval: 10m
  values:
    kind: CronJob
    schedule: "*/10 * * * *" # Runs every 10 minutes
    
    # Crucial configurations for safety
    cmdOptions:
      v: 2
      
    deschedulerPolicy:
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                ignorePvcPods: true # Protects stateful workloads from sudden moving
                evictLocalStoragePods: false
                evictSystemPods: false
            - name: RemoveDuplicates
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 20
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 20
                  memory: 20
                targetThresholds:
                  cpu: 70
                  memory: 70