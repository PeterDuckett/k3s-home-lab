apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  values:
  # Increase timeouts for BPF compilation and proxy interactions
    bpf:
      compileTimeout: "15m"
    # NOTE: ipv6 intentionally NOT enabled here -- the worker nodes'
    # Raspberry Pi kernels lack BTF (/sys/kernel/btf/vmlinux), which
    # breaks Cilium's eBPF CO-RE compilation for IPv6 (SNAT verifier
    # failure, cilium-envoy abort/core-dump). IPv4-only until the
    # kernels ship proper BTF support.
