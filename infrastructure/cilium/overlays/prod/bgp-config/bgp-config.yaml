apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-lb-pool
  namespace: kube-system
  labels:
    io.cilium.bgp/pool: homelab-pool
spec:
  blocks:
    # Full DHCP-pool range (10.14.100.100-254 is also the Lab VLAN's DHCP
    # range in UniFi) reserved for LoadBalancer IPs. Was previously split
    # into .100/30 (.100-.103) and .128/25 (.128-.255), leaving .104-.127
    # unusable -- widened to one contiguous range covering the whole thing.
    - start: 10.14.100.100
      stop: 10.14.100.255
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: service-advertisement
  namespace: kube-system
  labels:
    bgp-advertise: "true"
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels: {}
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: udm-pro-peer
  namespace: kube-system
spec:
  # FIXED: authSecretRef line completely removed
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          bgp-advertise: "true"
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: homelab-bgp-cluster
  namespace: kube-system
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  bgpInstances:
    - name: "k3s-bgp"
      localASN: 65002
      peers:
        - name: "udm-pro"
          peerAddress: 10.14.100.1
          peerASN: 65001
          peerConfigRef:
            name: udm-pro-peer
