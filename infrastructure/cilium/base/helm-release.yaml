apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m  # <--- ADD OR UPDATE THIS LINE
  chart:
    spec:
      chart: cilium
      version: "1.19.x"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Safe k3s defaults for the base layer
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    k8sServiceHost: "10.14.100.13"
    k8sServicePort: 6443
    kubeProxyReplacement: true
    envoy:
      enabled: false
    bgpControlPlane:
      enabled: true
    # socketLB's cgroup hooks (cil_sock4/6_connect, sendmsg, post_bind)
    # need CO-RE/BTF, which the Pi worker kernels (node-2-x, node-sdr)
    # don't ship. With it enabled, new pod endpoint creation on those
    # nodes hangs forever ("no BTF found ... not supported"). Service
    # routing still works fine via the packet-level (tc-attached) BPF
    # NAT path, which doesn't need CO-RE.
    socketLB:
      enabled: false
