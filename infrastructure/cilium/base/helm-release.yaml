apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m  # <--- ADD OR UPDATE THIS LINE
  chart:
    spec:
      # Pinned exact (not a floating "1.19.x" range) -- 1.19.8 carries
      # a backport (cilium/cilium#48778, PR #48376, merged 2026-09-01)
      # that makes socket-LB cgroup programs require kernel BTF
      # unconditionally, breaking all new pod networking on the Pi
      # worker nodes (node-2-x, node-sdr), which have no BTF at all.
      # 1.19.7 predates that backport. Revisit once upstream fixes
      # #48778 in a later release.
      chart: cilium
      version: "1.19.7"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Safe k3s defaults for the base layer
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    k8sServiceHost: "10.14.100.13"
    k8sServicePort: 6443
    kubeProxyReplacement: true
    envoy:
      enabled: false
    bgpControlPlane:
      enabled: true
