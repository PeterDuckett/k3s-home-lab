apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: database
spec:
  releaseName: valkey
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: "0.12.x"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Standard baseline configuration
    architecture: replication # Or 'standalone' depending on your needs
    # TODO: auth is off for now -- this chart needs ACL config
    # (auth.aclUsers / auth.aclConfig), not a plain password, and a
    # real credential shouldn't be committed in plaintext to this
    # public repo. Configure ACL auth via a Kubernetes Secret before
    # using this for anything that needs to be secure.
    auth:
      enabled: false
    primary:
      persistence:
        enabled: true
        storageClass: "longhorn"
        size: 8Gi
    readReplicas:
      replicaCount: 3
      persistence:
        enabled: true
        storageClass: "longhorn"
        size: 8Gi
