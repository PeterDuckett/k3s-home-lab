apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: database
spec:
  releaseName: valkey
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: "0.12.x"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # TODO: auth is off for now -- this chart uses ACL config
    # (auth.aclUsers / auth.aclConfig), not a plain password, and a
    # real credential shouldn't be committed in plaintext to this
    # public repo. Configure ACL auth via a Kubernetes Secret
    # (auth.usersExistingSecret) before using this for anything that
    # needs to be secure. Note: if auth is ever enabled, the
    # replicationUser ("default" below) must be defined in
    # auth.aclUsers with replication permissions (+psync +replconf +ping).
    auth:
      enabled: false

    # Single StatefulSet, (replica.replicas + 1) pods total -- pod-0
    # is the master, the rest replicate from it. There is no separate
    # "primary"/"readReplicas" config in this chart, unlike Bitnami's.
    replica:
      enabled: true
      replicas: 2
      replicationUser: "default"
      persistence:
        storageClass: "longhorn"
        size: 8Gi
