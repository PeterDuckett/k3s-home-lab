apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  values:
    # Enable the dashboard
    ingressRoute:
      dashboard:
        enabled: true

    service:
      annotations:
        # This tells Cilium LB IPAM to assign this specific IP from your pool
        lbipam.cilium.io/ips: "10.14.100.100"

    # ---- Ingress hardening ------------------------------------------------
    ports:
      web:
        forwardedHeaders:
          # This origin is only reachable via Cloudflare (WAN:80/443 is
          # restricted to these ranges at the edge firewall), so trust the
          # X-Forwarded-For Cloudflare sends -- otherwise HA sees every
          # visitor as a Cloudflare edge IP. Refresh from
          # https://www.cloudflare.com/ips/ if Cloudflare changes them.
          trustedIPs: &cloudflare_ips
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
        # Permanently redirect all plain HTTP to HTTPS.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        forwardedHeaders:
          trustedIPs: *cloudflare_ips
        # Apply the security-headers Middleware to every HTTPS router by default.
        http:
          middlewares:
            - kube-system-security-headers@kubernetescrd

    # Global TLS policy: TLS 1.2 floor, and reject handshakes whose SNI does
    # not match a configured host (bare-IP / scanner probes get no response).
    tlsOptions:
      default:
        minVersion: VersionTLS12
        sniStrict: true

    # Layout rules for your RK1 and RPi mixed cluster
    deployment:
      replicas: 3
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
        podAntiAffinity: # <-- Moved inside the affinity block
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - traefik
                topologyKey: kubernetes.io/hostname
