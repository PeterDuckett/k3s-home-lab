apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  values:
    # Enable the dashboard
    ingressRoute:
      dashboard:
        enabled: true

    service:
      annotations:
        # This tells Cilium LB IPAM to assign this specific IP from your pool
        lbipam.cilium.io/ips: "10.14.100.100"

    # ---- Ingress hardening ------------------------------------------------
    ports:
      web:
        # Permanently redirect all plain HTTP to HTTPS.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        # Apply the security-headers Middleware to every HTTPS router by default.
        http:
          middlewares:
            - kube-system-security-headers@kubernetescrd

    # Global TLS policy: TLS 1.2 floor, and reject handshakes whose SNI does
    # not match a configured host (bare-IP / scanner probes get no response).
    tlsOptions:
      default:
        minVersion: VersionTLS12
        sniStrict: true

    # Layout rules for your RK1 and RPi mixed cluster
    deployment:
      replicas: 3
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
        podAntiAffinity: # <-- Moved inside the affinity block
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - traefik
                topologyKey: kubernetes.io/hostname
