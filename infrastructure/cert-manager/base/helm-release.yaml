apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  releaseName: cert-manager
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.x" # Pin this to your preferred stable version
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    createNamespace: true
  values:
    # This automatically provisions the required cert-manager CRDs
    crds:
      enabled: true

    # Native chart toggle for a ServiceMonitor against the existing
    # cert-manager Service (port "tcp-prometheus-servicemonitor" -> 9402,
    # already there by chart default even with this off). prometheus.enabled
    # is already the chart default; set explicitly for clarity.
    # release: kube-prometheus-stack matches our Prometheus's
    # serviceMonitorSelectorNilUsesHelmValues default (see
    # infrastructure/monitoring).
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack