# Real, trusted certs -- rate-limited to 50 certs/domain/week. Switch to
# this once letsencrypt-staging.yaml is confirmed working end to end.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: peter.james.duckett+letsencrypt@googlemail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "peterduckett.me"
