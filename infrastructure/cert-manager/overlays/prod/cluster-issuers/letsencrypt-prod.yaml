# Real, trusted certs -- rate-limited to 50 certs/domain/week. Switch to
# this once letsencrypt-staging.yaml is confirmed working end to end.
#
# `email` is deliberately omitted here (it's an +optional field on
# cert-manager's ACMEIssuer type). It's set live only, via a separate
# field-manager, applied directly to the cluster rather than committed --
# same reasoning as cloudflare-api-token-secret. Since Flux's own applies
# never mention this field, Server-Side Apply won't touch or revert it on
# reconcile the way it would if a placeholder value were committed here.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "peterduckett.me"
