# DNS-01 challenges via Cloudflare, so certs work for internal-only hosts too
# (not just things exposed to the internet for an HTTP-01 challenge), and we
# get wildcard cert support for free.
#
# The Cloudflare API token (cloudflare-api-token-secret, key api-token) is
# applied live only, not committed here -- same reasoning as the other real
# credentials in this repo: it can edit DNS for the whole zone.
#
# Use letsencrypt-staging while testing (untrusted-by-browsers certs, very
# high rate limits) and switch to letsencrypt-prod once it's confirmed
# working -- prod is rate-limited to 50 certs/domain/week.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: peter.james.duckett+letsencrypt@googlemail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "peterduckett.me"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: peter.james.duckett+letsencrypt@googlemail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "peterduckett.me"
