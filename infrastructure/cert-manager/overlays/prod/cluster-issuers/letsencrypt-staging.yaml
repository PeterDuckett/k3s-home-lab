# Untrusted-by-browsers test certs, very high rate limits -- use this one
# while testing the DNS-01 solver end to end before switching to
# letsencrypt-prod.yaml.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: peter.james.duckett+letsencrypt@googlemail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "peterduckett.me"
