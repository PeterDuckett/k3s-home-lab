# Untrusted-by-browsers test certs, very high rate limits -- use this one
# while testing the DNS-01 solver end to end before switching to
# letsencrypt-prod.yaml.
#
# `email` is deliberately omitted here (it's an +optional field on
# cert-manager's ACMEIssuer type). It's set live only, via a separate
# field-manager, applied directly to the cluster rather than committed --
# same reasoning as cloudflare-api-token-secret. Since Flux's own applies
# never mention this field, Server-Side Apply won't touch or revert it on
# reconcile the way it would if a placeholder value were committed here.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "peterduckett.me"
