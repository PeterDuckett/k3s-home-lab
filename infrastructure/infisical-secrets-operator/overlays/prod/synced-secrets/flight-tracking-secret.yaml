# Per-pod Secrets for the flight-tracking namespace. Each InfisicalStaticSecret
# merges the shared /common geo data with that pod's own subfolder under
# /flight-tracking (project 95bb0597-...bbf9, env prod). Kept per-pod rather than
# one merged Secret because several feeders reuse generic key names
# (SHARING_KEY, etc.) that would collide.
#
# Infisical layout:
#   /common                            LATITUDE, LONGITUDE, ALTITUDE (=60m), ALTITUDE_M (=60)
#   /flight-tracking                   MLAT_USER (= duckett-home)
#   /flight-tracking/ultrafeeder       UUID
#   /flight-tracking/flightradar24     SHARING_KEY
#   /flight-tracking/piaware           FEEDER_ID
#   /flight-tracking/planefinder       SHARECODE
#   /flight-tracking/adsbhub           CLIENTKEY
#   /flight-tracking/opensky-network   USERNAME, SERIAL
#   /flight-tracking/airnavradar       SHARING_KEY
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ultrafeeder-secret-sync
  namespace: flight-tracking
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /common
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /flight-tracking
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /flight-tracking/ultrafeeder
  targets:
    - name: ultrafeeder-secret
      namespace: flight-tracking
      kind: Secret
      creationPolicy: Owner
---
