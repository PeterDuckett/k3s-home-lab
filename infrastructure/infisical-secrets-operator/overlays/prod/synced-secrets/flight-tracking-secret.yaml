# Builds the flight-tracking-secrets Secret consumed by every HelmRelease in
# the flight-tracking namespace (ultrafeeder + the six aggregator feeders).
#
# Merges two Infisical paths:
#   /common          -- reusable site geo data (FEEDER_LAT/LONG/ALT/ALT_M)
#   /flight-tracking -- this stack's identity + per-service feeder keys
#     MLAT_USER, ULTRAFEEDER_UUID, FR24_SHARING_KEY, PLANEFINDER_SHARECODE,
#     PIAWARE_FEEDER_ID, ADSBHUB_CLIENTKEY, OPENSKY_USERNAME, OPENSKY_SERIAL,
#     AIRNAVRADAR_SHARING_KEY
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: flight-tracking-secrets-sync
  namespace: flight-tracking
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /common
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /flight-tracking
  targets:
    - name: flight-tracking-secrets
      namespace: flight-tracking
      kind: Secret
      creationPolicy: Owner
