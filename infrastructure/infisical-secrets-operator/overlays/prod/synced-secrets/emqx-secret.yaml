# Syncs EMQX dashboard admin credentials and Home Assistant's MQTT client
# credentials from Infisical instead of being a plaintext Secret manifest.
# See apps/base/messaging/emqx-release.yaml for what consumes this
# (EMQX_DASHBOARD__DEFAULT_USERNAME, EMQX_DASHBOARD__DEFAULT_PASSWORD).
# MQTT_HA_USERNAME/MQTT_HA_PASSWORD are provisioned into EMQX's built-in
# auth database via the HTTP API as a one-time post-deploy step -- they
# aren't consumed as env vars by the chart itself.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: emqx-secret-sync
  namespace: messaging
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Messaging/EMQX
  targets:
    - name: emqx-secret
      namespace: messaging
      kind: Secret
      creationPolicy: Owner
