# Syncs the Radarr/Sonarr API keys Recyclarr uses from Infisical instead of
# being a plaintext Secret manifest. See apps/base/recyclarr/release.yaml for
# what consumes this (RADARR_API_KEY, SONARR_API_KEY via envFrom).
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: recyclarr-secret-sync
  namespace: downloads
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Downloads/Recyclarr
  targets:
    - name: recyclarr-secret
      namespace: downloads
      kind: Secret
      creationPolicy: Owner
