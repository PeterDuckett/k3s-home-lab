# Syncs the Tdarr Node API key from Infisical instead of being a plaintext
# Secret manifest. See apps/base/tdarr/release.yaml -- with auth enabled,
# the internal Tdarr Node needs this same key set as both apiKey (its own
# client credential) and seededApiKey (tells the server to accept it) since
# internalNode: "true" runs both in the same container.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: tdarr-secret-sync
  namespace: downloads
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Downloads/Tdarr
  targets:
    - name: tdarr-secret
      namespace: downloads
      kind: Secret
      creationPolicy: Owner
