# Syncs the notifiarr-secret Deployment credential from Infisical instead of
# being a plaintext Secret manifest. See apps/base/notifiarr/release.yaml for
# what consumes this (DN_API_KEY).
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: notifiarr-secret-sync
  namespace: downloads
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Notifiarr
  targets:
    - name: notifiarr-secret
      namespace: downloads
      kind: Secret
      creationPolicy: Owner
