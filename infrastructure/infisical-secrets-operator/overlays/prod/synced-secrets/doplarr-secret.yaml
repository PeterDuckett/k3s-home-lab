# Syncs the doplarr-secret Deployment credentials from Infisical instead of
# being a plaintext Secret manifest. See apps/base/doplarr/release.yaml for
# what consumes this (DISCORD_TOKEN, RADARR_URL, RADARR_API_KEY, SONARR_URL,
# SONARR_API_KEY).
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: doplarr-secret-sync
  namespace: downloads
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Doplarr
  targets:
    - name: doplarr-secret
      namespace: downloads
      kind: Secret
      creationPolicy: Owner
