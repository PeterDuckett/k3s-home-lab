# Syncs the Traefik BasicAuth credential for Maintainerr from Infisical
# instead of being a plaintext Secret manifest. Maintainerr has no built-in
# login (by design -- see [[maintainerr-public-exposure-auth-gap]] memory),
# so auth is enforced at the Traefik layer instead via a BasicAuth
# Middleware (see apps/base/maintainerr/basicauth-middleware.yaml).
#
# The Infisical value is already the full htpasswd-format line
# (user:hashed-password, apr1/MD5), not a plaintext password -- Traefik's
# basicAuth secret expects the hash directly under the `users` key.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: maintainerr-basicauth-secret-sync
  namespace: downloads
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Downloads/Maintainerr
  targets:
    - name: maintainerr-basicauth
      namespace: downloads
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          users: '{{ .HTPASSWD_LINE.Value }}'
