# Postgres role password for Paperclip's database. Same shared
# /Database/PostgreSQL folder and prefixed-key convention as
# homeassistant-secret.yaml. Consumed by DatabaseRole.spec.passwordSecret in
# infrastructure/cloudnative-pg/overlays/prod/postgres-clusters/paperclip-database.yaml.
# The app's own DATABASE_URL is templated from the same keys in
# apps/base/paperclip/paperclip-secret.yaml.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: paperclip-postgres-secret-sync
  namespace: database
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Database/PostgreSQL
  targets:
    - name: paperclip-postgres-credentials
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          username: '{{ .PAPERCLIP_USERNAME.Value }}'
          password: '{{ .PAPERCLIP_PASSWORD.Value }}'
