# Syncs the Postgres role password for Home Assistant's recorder database
# from Infisical instead of being a plaintext Secret manifest. See
# infrastructure/cloudnative-pg/overlays/prod/postgres-clusters/homeassistant-database.yaml
# for what consumes this (DatabaseRole.spec.passwordSecret).
#
# /Database/PostgreSQL is a shared folder (not per-app), so the Infisical
# keys are prefixed (HOMEASSISTANT_USERNAME/HOMEASSISTANT_PASSWORD) to avoid
# colliding with future roles added to the same folder -- then templated
# down to the plain username/password keys CNPG requires
# (kubernetes.io/basic-auth format).
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: homeassistant-postgres-secret-sync
  namespace: database
spec:
  infisicalAuthRef:
    name: k3s-operator
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 95bb0597-b6d2-4129-9145-8c46a1f9bbf9
      environmentSlug: prod
      secretPath: /Database/PostgreSQL
  targets:
    - name: homeassistant-postgres-credentials
      namespace: database
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          username: '{{ .HOMEASSISTANT_USERNAME.Value }}'
          password: '{{ .HOMEASSISTANT_PASSWORD.Value }}'
