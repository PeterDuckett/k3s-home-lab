# The actual CNPG operator install. The Postgres Cluster resources it manages
# live separately under overlays/prod/postgres-clusters, since they depend on
# the CRDs this HelmRelease installs and must be reconciled afterwards.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.x"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 1h
  # Runs in database alongside Valkey and the Postgres Cluster it manages,
  # rather than a dedicated cnpg-system namespace -- the operator itself
  # watches Cluster CRs cluster-wide regardless of its own namespace, so a
  # separate namespace isn't required.
  targetNamespace: database
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
