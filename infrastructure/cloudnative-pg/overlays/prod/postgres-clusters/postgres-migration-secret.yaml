# Password for the "infisical" user on the OLD bundled Bitnami Postgres
# (infisical namespace), used one-time by infisical-postgres-cluster.yaml's
# bootstrap.initdb.import to pg_dump/pg_restore the existing data into the
# new HA cluster. Matches infrastructure/infisical/base/helm-release.yaml's
# postgresql.auth.password. Safe to delete once the import has completed and
# Infisical has cut over to this cluster.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-old-postgres-credentials
  namespace: database
type: Opaque
stringData:
  password: "root"
