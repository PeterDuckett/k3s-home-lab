apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-database
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"          # CNPG handles HA; Longhorn doesn't need to duplicate it over the network
  dataLocality: "strict-local"    # Keeps the storage volume on the exact same node as the Postgres Pod
  fsType: "ext4"