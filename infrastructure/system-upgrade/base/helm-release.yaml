apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: system-upgrade-controller
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: system-upgrade-controller
      # Note: Rancher uses unique versions (like 105.x.x) for its system chart tracking
      version: "107.0.1" 
      sourceRef:
        kind: HelmRepository
        name: rancher-charts
      interval: 1h
  # CRITICAL: The official chart assumes deployment into cattle-system
  targetNamespace: cattle-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3