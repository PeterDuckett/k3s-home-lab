apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: rancher
      version: ">=2.14.0" # Keeps it tracking the latest minor/patch versions securely
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
        namespace: flux-system
      interval: 1h
  targetNamespace: cattle-system
  install:
    createNamespace: true
  values:
    hostname: rancher.peterduckett.me # Update to match your local network's DNS/UDM Pro setup
    replicas: 3
    bootstrapPassword: "BullFrog"

    # Optional: If you are managing your certificates outside of cert-manager (e.g. at the Unifi proxy level)
    # tls: external

    # If your Cilium ingress setup requires a specific ingress class, uncomment below:
    # ingress:
    #   ingressClassName: cilium

    # Default (source: rancher) generates Rancher's own self-signed CA cert.
    # That's not publicly trusted, so once this went behind Cloudflare
    # (proxied, "Full (strict)" mode) it started returning HTTP 526 (Invalid
    # SSL Certificate) -- confirmed 2026-09-17. Switching to the same
    # cert-manager + letsencrypt-prod DNS-01 pattern everything else here
    # uses, instead of touching Cloudflare's zone-wide SSL mode for just
    # this one app.
    ingress:
      tls:
        source: secret
      extraAnnotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod