apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      # Track the 91.x line. Check for newer majors periodically.
      version: "92.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Same reasoning as infrastructure/longhorn/base/helm-release.yaml: the
    # control-plane nodes aren't tainted today, but tolerate the standard
    # taints anyway so this keeps scheduling if that ever changes.
    prometheus:
      prometheusSpec:
        retention: 15d
        # Had no requests, so the scheduler counted ~3Gi of real usage as
        # zero on node-1-2. Sized for ~230k head series after PR #67; no
        # CPU limit (compaction bursts would just get throttled).
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi
        tolerations: &control-plane-tolerations
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        tolerations: *control-plane-tolerations

    grafana:
      # Single replica on a ReadWriteOnce volume: a RollingUpdate surge pod
      # can't attach the PVC while the old pod holds it, so upgrades hang
      # until Helm times out. Recreate stops the old pod first.
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        type: pvc
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        size: 5Gi
      tolerations: *control-plane-tolerations
      # adminPassword intentionally left unset -- the chart generates a
      # random one and stores it in the kube-prometheus-stack-grafana
      # Secret (key: admin-password) rather than committing a password to
      # git. Retrieve it with:
      #   kubectl -n monitoring get secret kube-prometheus-stack-grafana \
      #     -o jsonpath='{.data.admin-password}' | base64 -d

    kubelet:
      serviceMonitor:
        # k3s runs the apiserver and kubelet in one process, so each
        # control-plane kubelet's /metrics re-exports every apiserver_* and
        # etcd_* series the apiserver job already scrapes from :6443 (~80%
        # of this job's series). Drop the copies here; the apiserver job
        # keeps the full set. Applies to /metrics only, not cadvisor/probes.
        metricRelabelings:
          # Chart default, repeated because setting this list replaces it.
          - sourceLabels: [__name__, le]
            regex: "(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\\.0)?"
            action: drop
          - sourceLabels: [__name__]
            regex: "(apiserver|etcd)_.*"
            action: drop

    prometheusOperator:
      tolerations: *control-plane-tolerations

    prometheus-node-exporter:
      # Must run on every node, including node-2-3, which is tainted
      # dedicated=downloads:NoSchedule.
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "downloads"
          effect: "NoSchedule"

    kube-state-metrics:
      tolerations: *control-plane-tolerations
