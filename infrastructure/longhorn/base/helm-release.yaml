apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      # 1. Upgrade one minor at a time (Longhorn only supports N-1 -> N).
      version: "1.12.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system # Explicitly defined namespace for safety
      interval: 1h
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultReplicaCount: 3
      createDefaultDiskLabeledNodes: true 
      kubeletRootDir: "/var/lib/rancher/k3s/agent/kubelet"
      # Live-upgrade volume engines automatically after a Longhorn upgrade,
      # one volume per node at a time. strict-local volumes (Postgres) are
      # skipped -- they need an offline upgrade (hibernate CNPG).
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
    
    # 2. Added tolerations to ALL core system components so they can run on your masters
    longhornCSI:
      kubeletRootDir: "/var/lib/rancher/k3s/agent/kubelet"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
    
    longhornManager:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

    longhornDriver:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

    # 3. Standard helm values mapping for the driver deployer environment variable
    driverDeployer:
      environment:
        KUBELET_ROOT_DIR: "/var/lib/rancher/k3s/agent/kubelet"

    # 4. Native chart toggle for a ServiceMonitor against longhorn-manager's
    # existing /metrics endpoint (port "manager", already on the
    # longhorn-backend Service -- no separate Service needed).
    # release: kube-prometheus-stack matches our Prometheus's
    # serviceMonitorSelectorNilUsesHelmValues default (see
    # infrastructure/monitoring), which only watches ServiceMonitors with
    # that exact label regardless of namespace.
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack

    # 5. Longhorn 1.12.1+ installs internal NetworkPolicies by default
    # (restrictInternalTraffic). Cilium enforces them, and they (a) block
    # cross-namespace Prometheus scraping of longhorn-manager and (b) are
    # untested on this cluster's Cilium 1.19.7 / no-BTF Pi kernel setup,
    # where Longhorn warns blocked traffic can hang volume attach/recovery.
    # Kept off to match pre-1.12 behaviour; enable as a separate, tested
    # change (with an allow policy for the monitoring namespace).
    networkPolicies:
      restrictInternalTraffic: false
