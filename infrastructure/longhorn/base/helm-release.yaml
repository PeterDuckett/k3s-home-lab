apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system # Matches your actual Flux tracking namespace
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.11.x" # Use an explicit, valid version string instead of "1.11.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultReplicaCount: 3 
      # 1. Enable custom label checking
      createDefaultDiskLabeledNodes: true 
      # 2. Tell Longhorn to look for your specific label key:value
      customLabels: "storage-node:true"
    csi:
      # Crucial fix for K3s kubelet directory path
      kubeletRootDir: /var/lib/rancher/k3s/agent/kubelet
    
    # Longhorn Manager runs everywhere to coordinate, but we must tolerate master taints
    longhornManager:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

    # CSI Driver MUST run cluster-wide. We remove the nodeSelector so worker nodes get the driver.
    longhornDriver:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"