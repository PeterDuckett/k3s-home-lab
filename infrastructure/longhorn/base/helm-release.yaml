apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system  # The namespace where Flux tracks this release
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.11.x"   # Replace with your specific desired version string
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultReplicaCount: 3
      # Tells Longhorn to only initialize physical disks where your custom label exists
      createDefaultDiskLabeledNodes: true 
      customLabels: "storage-node:true"
    
    csi:
      # CRITICAL K3S DIRECTORY OVERRIDE:
      kubeletRootDir: /var/lib/rancher/k3s/agent/kubelet
    
    # Tolerates master taints so control plane orchestration can occur
    longhornManager:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

    # CRITICAL: CSI Driver must run cluster-wide so worker nodes can mount volumes.
    # No nodeSelector here!
    longhornDriver:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"