apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.11.x" # Note: Ensure your chart version is compatible; standard stable is currently 1.7.x / 1.8.x
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultReplicaCount: 3
      createDefaultDiskLabeledNodes: true 
      # Ensure you apply the "storage-node=true" label to your worker nodes!
      customLabels: "storage-node:true"
      kubeletRootDir: "/var/lib/kubelet"
    
    # CORRECT KEY: This configures the actual CSI driver components
    longhornCSI:
      kubeletRootDir: "/var/lib/kubelet"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
    
    longhornManager:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"