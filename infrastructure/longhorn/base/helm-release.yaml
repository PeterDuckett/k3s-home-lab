apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      # 1. Keep an eye on the version. Standard Longhorn versions are currently 1.7.x / 1.8.x.
      version: "1.11.x" 
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system # Explicitly defined namespace for safety
      interval: 1h
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultSettings:
      defaultReplicaCount: 3
      createDefaultDiskLabeledNodes: true 
      kubeletRootDir: "/var/lib/rancher/k3s/agent/kubelet"
    
    # 2. Added tolerations to ALL core system components so they can run on your masters
    longhornCSI:
      kubeletRootDir: "/var/lib/rancher/k3s/agent/kubelet"
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
    
    longhornManager:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

    longhornDriver:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

    # 3. Standard helm values mapping for the driver deployer environment variable
    driverDeployer:
      environment:
        KUBELET_ROOT_DIR: "/var/lib/rancher/k3s/agent/kubelet"