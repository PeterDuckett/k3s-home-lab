# Daily filesystem trim for every volume in the "default" recurring-job
# group (all volumes are in it by default). Longhorn doesn't reclaim blocks
# when files are deleted inside a volume, so churny volumes like
# downloads-ssd grow to their full size on the node disk over time; a trim
# hands the freed blocks back. A manual trim on downloads-ssd on 2026-10-15
# reclaimed ~200G on node-2-3 ssd1.
#
# Trim only reclaims space in the volume head -- data still referenced by
# snapshots stays (remove-snapshots-during-filesystem-trim is false).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim-daily
  namespace: longhorn-system
spec:
  task: filesystem-trim
  # Daily 04:00 (UTC), when the media stack is quiet
  cron: "0 4 * * *"
  groups:
    - default
  concurrency: 1
  retain: 0
  labels: {}
